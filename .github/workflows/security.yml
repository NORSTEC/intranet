##
# Blocks a pull request that adds a dependency with a known vulnerability.
#
# A compromised or vulnerable package is one of the few realistic ways into the
# production deployment, and that deployment holds an identity that can read the
# member database and suspend Google accounts. This compares what the branch
# adds against what `main` already had, so it only ever complains about
# something the pull request is actually introducing.
#
# CodeQL is deliberately NOT here. GitHub's own default setup does the same
# analysis, keeps itself updated, and needs no workflow file to maintain or
# pinned action to refresh — turn it on under Settings → Code security. Running
# both would only produce duplicate alerts.
##
name: Security

on:
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # A dependency with a known high-severity vulnerability does not get
          # merged. Lower severities are reported in the pull request and left
          # to judgement.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
